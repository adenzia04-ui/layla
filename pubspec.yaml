name: noor
description: "Layla Pro — stay connected with your prayers."
publish_to: 'none'
version: 1.0.0+6

environment:
  # Raised from 3.6/3.27 by the live prayer-mat scanner: camera 0.12 is the
  # first release with the fix for a CameraController updating its value after
  # disposal, which is exactly the race a scanner that tears itself down
  # mid-frame would hit.
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'  # camera 0.12; Color.withValues since 3.27

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ───────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  # firebase_storage intentionally absent: prayer-mat photos are kept
  # on-device (see prayer_lock/data/proof_repository.dart). Storage now
  # requires a paid Blaze plan and would make the feature less private.

  # ── State & routing ────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # ── Prayer domain ──────────────────────────────────────────
  adhan: ^2.0.0+1          # prayer times, SunnahTimes (tahajjud), Qibla bearing
  hijri: ^3.0.0            # islamic date

  # ── Device ─────────────────────────────────────────────────
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_compass: ^0.8.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  # The live viewfinder behind Step 2. image_picker stays for the mat-check
  # test button in settings, which wants one photo and no scanner.
  camera: ^0.12.0+2
  path_provider: ^2.1.4     # prayer-mat photos live on-device, not in the cloud
  wakelock_plus: ^1.2.8

  # ── Notifications ──────────────────────────────────────────
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # ── Map (no API key required) ──────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── UI & utils ─────────────────────────────────────────────
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  http: ^1.6.0
  crypto: ^3.0.3
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0
  share_plus: ^13.3.0
  just_audio: ^0.10.6
  flutter_tts: ^4.2.5
  in_app_purchase: ^3.3.0

  # So the Profile footer can state which build this actually is.
  package_info_plus: ^10.2.1
  image: ^4.10.1

dev_dependencies:
  # Used by quran_passages_test to pin the fetched Arabic. Declared rather
  # than leaned on transitively, so a dependency change cannot quietly remove
  # the check that the Qur'anic text has not been edited.
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid_glass.frag

  assets:
    - assets/images/
    - assets/duas/
    - assets/sounds/
    - assets/textures/

  # Bundled rather than fetched at runtime. google_fonts downloads on first
  # launch, so a fresh install with no signal renders in a fallback face —
  # not acceptable for an app people open at 5am. Both are variable fonts
  # (SIL OFL, licences alongside them in assets/fonts/).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    # Outfit: names, titles, prayer names. A variable file, so the weight
    # is set through the wght axis rather than by picking a static face.
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    # Neither Inter nor Playfair carries a single Arabic glyph, so all
    # Arabic was falling through to the iOS system face, which is not cut
    # for Uthmani orthography — the superscript alefs and small high marks
    # sat wrong. Amiri Quran is drawn for exactly this text.
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
