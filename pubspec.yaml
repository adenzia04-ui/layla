name: noor
description: "Layla — stay connected with your prayers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'  # Color.withValues

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ───────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  # firebase_storage intentionally absent: prayer-mat photos are kept
  # on-device (see prayer_lock/data/proof_repository.dart). Storage now
  # requires a paid Blaze plan and would make the feature less private.

  # ── State & routing ────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # ── Prayer domain ──────────────────────────────────────────
  adhan: ^2.0.0+1          # prayer times, SunnahTimes (tahajjud), Qibla bearing
  hijri: ^3.0.0            # islamic date

  # ── Device ─────────────────────────────────────────────────
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_compass: ^0.8.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4     # prayer-mat photos live on-device, not in the cloud
  wakelock_plus: ^1.2.8

  # ── Notifications ──────────────────────────────────────────
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # ── Map (no API key required) ──────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── UI & utils ─────────────────────────────────────────────
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid_glass.frag

  assets:
    - assets/images/
    - assets/duas/
    - assets/textures/

  # Bundled rather than fetched at runtime. google_fonts downloads on first
  # launch, so a fresh install with no signal renders in a fallback face —
  # not acceptable for an app people open at 5am. Both are variable fonts
  # (SIL OFL, licences alongside them in assets/fonts/).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
